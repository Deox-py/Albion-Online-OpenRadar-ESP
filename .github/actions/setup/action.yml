name: Setup OpenRadar toolchain
description: Go from go.mod, Node 24, Linux CGO libraries and optional npm dependencies

inputs:
  install-dependencies:
    description: Install npm dependencies (the Windows portable builder can handle this itself)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version-file: "go.mod"
        cache: true

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: "npm"

    - name: Install libpcap and ALSA (CGO, Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libpcap-dev libasound2-dev

    - name: Install npm dependencies
      if: inputs.install-dependencies == 'true'
      shell: bash
      env:
        PUPPETEER_SKIP_DOWNLOAD: "true"
      run: npm ci
